<script type="module">

import { destinos, servicios, paquetes } from './data.js';

/* DESTINOS */
const contDestinos = document.getElementById("contenedor-destinos");

destinos.forEach(d => {
    contDestinos.innerHTML += `
        <div class="card">
            <img src="${d.imagen}">
            <div class="card-content">
                <h3>${d.titulo}</h3>
                <p>${d.descripcion}</p>

                <!-- SOLO CAMBIÉ ESTO -->
                <button class="btn" onclick="abrirDetalle('${d.titulo}')">
                   Consultar
                </button>
            </div>
        </div>
    `;
});

/* SERVICIOS */
const contServicios = document.getElementById("contenedor-servicios");

servicios.forEach(s => {
    contServicios.innerHTML += `
        <div class="card">
            <div class="card-content">
                <h3>${s.titulo}</h3>
                <p>${s.descripcion}</p>
            </div>
        </div>
    `;
});

/* MODAL */
window.abrirDetalle = function(titulo){

    const modal = document.getElementById("modal");
    const box = document.getElementById("modal-box");

    const paquete = paquetes.find(p => p.titulo === titulo);

    if(!paquete){
        box.innerHTML = "<p>No hay información disponible</p>";
        modal.style.display = "flex";
        return;
    }

    let galeria = "";
    if(paquete.galeria){
        paquete.galeria.forEach(img => {
            galeria += `<img src="${img}">`;
        });
    }

    box.innerHTML = `
        <h2>${paquete.titulo}</h2>
        <img src="${paquete.imagen}">
        <p>${paquete.descripcion}</p>

        <h3 style="color:#5b21b6;">${paquete.precio}</h3>

        <p><b>🕒 Horarios:</b> ${paquete.horarios}</p>
        <p><b>📦 Plan:</b> ${paquete.plan}</p>
        <p><b>⭐ Opiniones:</b> ${paquete.opiniones}</p>

        ${galeria}

        <a href="https://wa.me/51912139525?text=Hola,%20quiero%20el%20paquete%20${encodeURIComponent(paquete.titulo)}" 
           class="btn" target="_blank">
           Reservar por WhatsApp
        </a>
    `;

    modal.style.display = "flex";
};

/* CERRAR */
document.addEventListener("click", (e)=>{
    if(e.target.id === "modal"){
        document.getElementById("modal").style.display = "none";
    }
});

/* TU JS ORIGINAL */
const elementos = document.querySelectorAll('.oculto');

window.addEventListener('scroll',()=>{
    elementos.forEach(el=>{
        if(el.getBoundingClientRect().top < window.innerHeight - 100){
            el.classList.add('visible');
        }
    });
});

const toggle = document.getElementById("menu-toggle");
const menu = document.getElementById("menu");

toggle.addEventListener("click",()=>{
    menu.classList.toggle("active");
});

window.addEventListener("load",()=>{
    document.body.classList.add("visible");
});

</script>

<!-- AGREGA ESTO ANTES DE </body> -->
<div id="modal" class="modal">
    <div class="modal-box" id="modal-box"></div>
</div>
