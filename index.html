<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agencia de Viajes Elimar</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">✈️ Agencia Elimar</div>

    <div class="menu-toggle" id="menu-toggle">☰</div>

    <nav id="menu">
        <a href="#inicio">Inicio</a>
        <a href="#" onclick="abrirModalGeneral()">Paquetes</a>
        <a href="#destinos">Destinos</a>
        <a href="#servicios">Servicios</a>
        <a href="#contacto">Contacto</a>
    </nav>
</header>

<!-- HERO -->
<section class="hero" id="inicio">
    <div>
        <h1>Viaja sin límites</h1>
        <p>Descubre el mundo con Agencia Elimar</p>
        <a href="#" onclick="abrirModalGeneral()" class="btn">Explorar paquetes</a>
    </div>
</section>

<!-- DESTINOS -->
<section class="section oculto" id="destinos">
    <h2 class="titulo">Destinos populares</h2>
    <div class="grid" id="contenedor-destinos"></div>
</section>

<!-- SERVICIOS -->
<section class="section oculto" id="servicios">
    <h2 class="titulo">Servicios que brindamos</h2>
    <div class="grid" id="contenedor-servicios"></div>
</section>

<!-- CONTACTO -->
<section class="section oculto" id="contacto">
    <h2 class="titulo">Contáctanos</h2>

    <div class="contacto">
        <p>📞 912139525</p>
        <p>📍 Guadalupe</p>

        <a href="https://wa.me/51912139525?text=Hola,%20vengo%20de%20la%20web%20de%20Agencia%20Elimar,%20quiero%20información" 
           class="btn" target="_blank">
        WhatsApp
        </a>
    </div>
</section>

<!-- FOOTER -->
<footer>
    <p>&copy; 2026 Agencia Elimar</p>
</footer>

<!-- BOTÓN WHATSAPP -->
<a href="https://wa.me/51912139525?text=Hola,%20quiero%20información" 
   class="whatsapp">💬</a>

<!-- MODAL PAQUETES -->
<div id="modal" class="modal">
    <div class="modal-box" id="modal-box"></div>
</div>

<!-- DATA -->
<script src="data.js"></script>

<!-- JS -->
<script>

/* DESTINOS */
var contDestinos = document.getElementById("contenedor-destinos");

destinos.forEach(function(d){
    contDestinos.innerHTML += `
        <div class="card">
            <img src="${d.imagen}">
            <div class="card-content">
                <h3>${d.titulo}</h3>
                <p>${d.descripcion}</p>

                <a href="https://wa.me/51912139525?text=Hola,%20me%20interesa%20${encodeURIComponent(d.titulo)}" 
                   target="_blank" class="btn">
                   Consultar
                </a>
            </div>
        </div>
    `;
});

/* SERVICIOS */
var contServicios = document.getElementById("contenedor-servicios");

servicios.forEach(function(s){
    contServicios.innerHTML += `
        <div class="card">
            <div class="card-content">
                <h3>${s.titulo}</h3>
                <p>${s.descripcion}</p>
            </div>
        </div>
    `;
});

/* MODAL PAQUETES */
function abrirModalGeneral(){

    var modal = document.getElementById("modal");
    var box = document.getElementById("modal-box");

    var contenido = "";

    paquetes.forEach(function(p){

        var galeria = "";
        if(p.galeria){
            p.galeria.forEach(function(img){
                galeria += `<img src="${img}">`;
            });
        }

        contenido += `
            <div style="margin-bottom:30px;">
                <h2>${p.titulo}</h2>
                <img src="${p.imagen}">
                <p>${p.descripcion}</p>
                <h3 style="color:#5b21b6;">${p.precio}</h3>

                <p><b>🕒 Horarios:</b> ${p.horarios}</p>
                <p><b>📦 Plan:</b> ${p.plan}</p>
                <p><b>⭐ Opiniones:</b> ${p.opiniones}</p>

                <h4>📸 Más imágenes</h4>
                ${galeria}

                <a href="https://wa.me/51912139525?text=Hola,%20quiero%20el%20paquete%20${encodeURIComponent(p.titulo)}" 
                   class="btn" target="_blank">
                   Reservar
                </a>
            </div>
        `;
    });

    box.innerHTML = contenido;
    modal.style.display = "flex";
}

/* CERRAR MODAL */
document.addEventListener("click", function(e){
    if(e.target.id === "modal"){
        document.getElementById("modal").style.display = "none";
    }
});

/* SCROLL */
var elementos = document.querySelectorAll('.oculto');

window.addEventListener('scroll',function(){
    elementos.forEach(function(el){
        if(el.getBoundingClientRect().top < window.innerHeight - 100){
            el.classList.add('visible');
        }
    });
});

/* MENU */
var toggle = document.getElementById("menu-toggle");
var menu = document.getElementById("menu");

toggle.addEventListener("click",function(){
    menu.classList.toggle("active");
});

/* ENTRADA */
window.addEventListener("load",function(){
    document.body.classList.add("visible");
});

</script>

</body>
</html>
